<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario de Productos con IndexedDB</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Inventario de Productos</h1>
        <p class="subtitle">Aplicación web con IndexedDB · versionada con Git y GitHub</p>
    </header>

    <div class="container">

        <div class="formContainer">
            <h2>Nuevo producto</h2>
            <label for="name">Nombre del producto</label>
            <input type="text" id="name" placeholder="Ej. Teclado mecánico">

            <label for="price">Precio</label>
            <input type="number" id="price" placeholder="Ej. 49.99" min="1" step="0.01">

            <button id="addProduct">Agregar producto</button>
        </div>

        <section class="tableSection">
            <div class="toolbar">
                <input type="search" id="search" placeholder="Buscar producto por nombre...">
                <div class="stats">
                    <div class="stat"><span>Productos</span><strong id="statCount">0</strong></div>
                    <div class="stat"><span>Valor total</span><strong id="statTotal">$0.00</strong></div>
                </div>
            </div>

            <table id="productsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>
    </div>

    <footer>
          Desarrollado por <strong>German Sanchez</strong> (@ozimandias345)
    </footer>

    <script src="functions.js"></script>
</body>
</html>
